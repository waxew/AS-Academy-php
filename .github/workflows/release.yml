name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate PHP course content
        run: python3 tools/validate_course.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require production signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

      - name: Restore production keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/as-academy-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/as-academy-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/signing/as-academy-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signed release and generate SHA-256
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release
          cp "$APK" release/AS-Academy-PHP-v0.4.0.apk
          sha256sum release/AS-Academy-PHP-v0.4.0.apk > release/SHA256SUMS.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-PHP-v0.4.0
          path: |
            release/AS-Academy-PHP-v0.4.0.apk
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.0 \
            release/AS-Academy-PHP-v0.4.0.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AS Academy PHP v0.4.0" \
            --notes "Production release of AS Academy PHP 0.4.0. Includes validated Course Package, verified signed APK and SHA-256 checksum."
