name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate PHP course content
        run: python3 tools/validate_course.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK integrity and signatures
        run: bash tools/verify_apks.sh

      - name: Upload APK checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-php-checksums-v0.4.0
          path: app/build/outputs/apk/checksums/SHA256SUMS.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-php-debug-v0.4.0
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: as-academy-php-release-unsigned-v0.4.0
          path: app/build/outputs/apk/release/*.apk
